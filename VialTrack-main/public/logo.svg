          filter="url(#glowFull)" />

    <!-- ECG Line -->
    <path d="M 22 54 
             L 38 54 
             L 43 43 
             L 49 67 
             L 56 27 
             L 63 77 
             L 70 48 
             L 75 58 
             L 80 54 
             L 86 54" 
